name: Run VinAI Telegram Bot

on:
  workflow_dispatch:

# Hindari dua bot aktif yang menulis file data bersamaan.
concurrency:
  group: vinai-telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  telegram-bot:
    name: Start bot (up to 6 hours)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate required secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "::error::Secret TELEGRAM_BOT_TOKEN belum diatur." && exit 1)
          test -n "$GEMINI_API_KEY" || (echo "::error::Secret GEMINI_API_KEY belum diatur." && exit 1)
          echo "Required secrets are present."

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_DIR: data
        run: python bot.py
